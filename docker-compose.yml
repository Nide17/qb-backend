services:
  mongodb:
    image: mongo:7.0
    container_name: qb-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_DATABASE=qb
    volumes:
      - mongodb_data:/data/db
    networks:
      - qb-network

  redis:
    image: redis:7-alpine
    container_name: qb-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - qb-network

  app:
    build: .
    container_name: qb-app
    restart: unless-stopped
    ports:
      - "4000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    depends_on:
      - mongodb
      - redis
    networks:
      - qb-network

volumes:
  mongodb_data:
  redis_data:

networks:
  qb-network:
    driver: bridge

